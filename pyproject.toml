[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lspx"
authors = [
  { name="Dan Salvato", email="dan@teamsalvato.com" },
]
description = "Converts OpenMPT-supported tracker modules (mod, s3m, xm, it, mptm) to Amiga LSP (LightSpeed Player) format."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dynamic = ["version"]
dependencies = [
    "numpy>=2.4.4",
]

[project.urls]
Source = "https://github.com/dansalvato/lspx"

[project.scripts]
lspx = "lspx.cli:main"

[tool.cibuildwheel]
skip = ["*-win32", "*-manylinux_i686", "cp3??t-*"]

[tool.cibuildwheel.macos]
before-build = "make -C openmpt-lspx -j $(sysctl -n hw.ncpu)"

[tool.cibuildwheel.linux]
before-build = "make -C openmpt-lspx -j $(nproc)"
manylinux-x86_64-image = "manylinux_2_34"
manylinux-aarch64-image = "manylinux_2_34"

[tool.cibuildwheel.windows]
before-build = [
    "set CC=clang",
    "set CXX=clang++",
    "set CPPFLAGS=-DLIBOPENMPT_BUILD_DLL",
    "make -C openmpt-lspx -j %NUMBER_OF_PROCESSORS%"
]

[tool.cibuildwheel.environment]
SHARED_LIB = '1'
STATIC_LIB = '0'
EXAMPLES = '0'
OPENMPT123 = '0'
TEST = '0'
MODERN = '1'
NO_ZLIB = '1'
NO_MPG123 = '1'
NO_OGG = '1'
NO_VORBIS = '1'
NO_VORBISFILE = '1'
NO_MINIZ = '1'
NO_MINIMP3 = '1'
NO_STBVORBIS = '1'
NO_PORTAUDIO = '1'
NO_PORTAUDIOCPP = '1'
NO_PULSEAUDIO = '1'
NO_SDL2 = '1'
NO_FLAC = '1'
NO_SNDFILE = '1'
SHARED_SONAME = '0'

[tool.hatch.metadata.hooks.custom]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.wheel.force-include]
"openmpt-lspx/bin/libopenmpt.so" = "src/lspx/libopenmpt.so"
